<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNAP</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <span class="logo"><img src="logo.svg" alt="SNAP" class="logo-img" />SNAP</span>
    <div class="topbar-controls">
      <input type="text" id="search" placeholder="Search…" autocomplete="off" />
      <button id="btn-list" class="view-btn active" title="List view">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
      </button>
      <button id="btn-grid" class="view-btn" title="Grid view">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
    </div>
  </header>

  <nav class="breadcrumb" id="breadcrumb" aria-label="Path navigation"></nav>

  <div id="ptr-indicator" aria-hidden="true">
    <svg class="ptr-arrow" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="4" x2="12" y2="20"/><polyline points="6 14 12 20 18 14"/></svg>
  </div>

  <main class="browser" id="browser" role="main"></main>

  <footer class="player-bar" id="player-bar" hidden>
    <button class="player-art-btn" id="player-art-btn" title="Now playing">
      <img id="player-art-img" src="" alt="" />
      <span class="art-fallback">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </span>
    </button>
    <div class="player-controls">
      <button id="btn-prev" title="Previous">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M6 5h2.5v14H6zm2.5 7L19 5v14z"/></svg>
      </button>
      <button id="btn-play" class="play-btn" title="Play/Pause">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M5 3.5v17L20 12z"/></svg>
      </button>
      <button id="btn-next" title="Next">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M15.5 5H18v14h-2.5zM5 5l10 7-10 7z"/></svg>
      </button>
    </div>
    <div class="player-mid-row">
      <button id="btn-shuffle" class="extra-btn" title="Shuffle">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button id="btn-repeat" class="extra-btn" title="Repeat">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <button id="btn-clear" class="extra-btn player-clear-btn" title="Clear queue">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <button id="btn-queue-view" class="extra-btn queue-view-btn" title="View queue">
      <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
    </button>
    <div class="player-seek">
      <span id="time-current">0:00</span>
      <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1" />
      <span id="time-total">0:00</span>
    </div>
    <div class="player-volume">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <input type="range" id="volume-bar" min="0" max="1" value="1" step="0.02" />
    </div>
  </footer>

  <!-- Selection action bar -->
  <div class="select-bar" id="select-bar" hidden>
    <span id="select-count">0 selected</span>
    <div class="select-actions">
      <button id="select-play-now">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M5 3.5v17L20 12z"/></svg>
        Play now
      </button>
      <button id="select-add-queue">+ Add to end of queue</button>
      <button id="select-cancel">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- Queue action modal -->
  <div class="modal-overlay" id="queue-modal" hidden>
    <div class="modal">
      <p class="modal-track-name" id="modal-track-name"></p>
      <button class="modal-btn" id="qm-play-now">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M5 3.5v17L20 12z"/></svg>
        Play now
      </button>
      <button class="modal-btn" id="qm-play-next">+ Add next in queue</button>
      <button class="modal-btn" id="qm-add-end">+ Add to end of queue</button>
      <button class="modal-btn modal-cancel" id="qm-cancel">Cancel</button>
    </div>
  </div>

  <!-- Queue panel -->
  <div class="queue-panel" id="queue-panel" hidden>
    <div class="queue-header">
      <span>Up next</span>
      <button id="queue-close" title="Close">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="queue-list" id="queue-list"></div>
  </div>

  <!-- Fullscreen player -->
  <div class="fullscreen-player" id="fullscreen-player" hidden>
    <button class="fs-close" id="fs-close" title="Close">
      <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="fs-art">
      <img id="fs-art-img" src="" alt="" />
      <span class="fs-art-fallback">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </span>
    </div>
    <div class="fs-info">
      <span id="fs-title" class="fs-title">—</span>
      <span id="fs-artist" class="fs-artist"></span>
    </div>
    <div class="fs-seek">
      <span id="fs-time-current">0:00</span>
      <input type="range" id="fs-seek-bar" min="0" max="100" value="0" step="0.1" />
      <span id="fs-time-total">0:00</span>
    </div>
    <div class="fs-controls">
      <button id="fs-btn-prev" title="Previous">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M6 5h2.5v14H6zm2.5 7L19 5v14z"/></svg>
      </button>
      <button id="fs-btn-skip-back" class="fs-skip-btn" title="Back 30s">
        <svg viewBox="0 0 32 32" width="32" height="32" fill="none" aria-hidden="true">
          <path d="M16 5 A11 11 0 1 0 21.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M24.5 4 L21.5 6.5 L24.5 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10.5 14 C15.5 14 15.5 17 10.5 17 C15.5 17 15.5 20 10.5 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <ellipse cx="19.5" cy="17" rx="2" ry="3" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
      <button id="fs-btn-play" class="play-btn" title="Play/Pause">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M5 3.5v17L20 12z"/></svg>
      </button>
      <button id="fs-btn-skip-fwd" class="fs-skip-btn" title="Forward 30s">
        <svg viewBox="0 0 32 32" width="32" height="32" fill="none" aria-hidden="true">
          <path d="M21.5 6.5 A11 11 0 1 1 16 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M13 2.5 L16 5 L13 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10.5 14 C15.5 14 15.5 17 10.5 17 C15.5 17 15.5 20 10.5 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <ellipse cx="19.5" cy="17" rx="2" ry="3" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
      <button id="fs-btn-next" title="Next">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M15.5 5H18v14h-2.5zM5 5l10 7-10 7z"/></svg>
      </button>
    </div>
    <div class="fs-extra">
      <button id="fs-btn-shuffle" class="extra-btn" title="Shuffle">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button id="fs-btn-repeat" class="extra-btn" title="Repeat">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <button id="fs-btn-queue" class="extra-btn" title="Queue">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
      </button>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
